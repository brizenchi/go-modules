# gitleaks configuration: default rules plus allowances for obvious test
# fixtures. Existing historical fixtures are pinned by fingerprint in
# .gitleaksignore; anything new must use an obviously fake value such as
# sk_test_not-a-real-key (docs/standards/TESTING.md#测试数据).
title = "go-modules"

[extend]
useDefault = true

[[allowlists]]
description = "Obviously fake fixture values"
regexes = ['''not-a-real''']

[[allowlists]]
description = "Build output and dependencies"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)\.cache/''',
]
