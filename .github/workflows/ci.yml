name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: '1.25.13'
  GO_PACKAGES: ./foundation/... ./modules/...

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Match the toolchain declared in the root go.mod (1.25).
          # Bumping setup-go to install 1.25 directly avoids GOTOOLCHAIN
          # auto-fetching a partial toolchain that's missing `covdata`,
          # which broke `go test -race -cover` in earlier runs.
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Build
        run: go build $GO_PACKAGES
      - name: Test
        run: go test -race -cover $GO_PACKAGES
      - name: Vet
        run: go vet $GO_PACKAGES

  template-nextjs:
    name: template-nextjs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/quickstart-nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: templates/quickstart-nextjs/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high

  template-quickstart:
    name: template-quickstart
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/quickstart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: templates/quickstart/go.sum
      - run: go test ./...
      - run: go build ./...
      - name: Monorepo Docker-equivalent build
        run: CGO_ENABLED=0 GOOS=linux go build -mod=readonly -ldflags="-s -w" -o /tmp/quickstart ./cmd/quickstart
      - name: Detached copy and Linux build using current modules
        working-directory: ${{ github.workspace }}
        run: ./scripts/verify-quickstart-release.sh local

  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - run: make fmt-check

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - run: make tidy-check

  purity:
    name: pkg purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make purity-check

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v1.64.5
          # install-mode: goinstall builds golangci-lint with the runner's
          # Go (1.25) instead of pulling a binary compiled against an older
          # Go release. Required because Go 1.25 syntax is unrecognised by
          # binaries built with Go 1.24 — yields "go language version (go1.24)
          # used to build golangci-lint is lower than the targeted Go version".
          install-mode: goinstall
          args: --config=${{ github.workspace }}/.golangci.yml ${{ env.GO_PACKAGES }}

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck $GO_PACKAGES

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history, baseline in .gitleaksignore)
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --no-banner --redact --config .gitleaks.toml

  observability-config:
    name: observability-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alert rules (promtool check + unit tests)
        working-directory: templates/quickstart/deploy/alerts
        run: |
          docker run --rm -v "$PWD:/rules" -w /rules --entrypoint promtool prom/prometheus:v3.15.0 check rules rules.yaml
          docker run --rm -v "$PWD:/rules" -w /rules --entrypoint promtool prom/prometheus:v3.15.0 test rules rules_test.yaml
      - name: Alloy config syntax
        working-directory: templates/quickstart/deploy/alloy
        run: docker run --rm -v "$PWD:/cfg" grafana/alloy:v1.20.1 fmt /cfg/config.alloy > /dev/null

  # Production deploy runs only after every gate above passes on a push to
  # main. Dokploy's own "Auto Deploy" must be OFF, otherwise it deploys on
  # push before CI finishes. govulncheck is intentionally not a gate: a newly
  # published CVE in a dependency must not block shipping an unrelated fix.
  # Docs: docs/standards/DEPLOYMENT.md#发布流程
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, template-nextjs, template-quickstart, fmt, tidy, purity, lint, secrets, observability-config]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_APPLICATION_IDS: ${{ secrets.DOKPLOY_APPLICATION_IDS }}
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Dokploy deploy
        run: ./scripts/deploy-dokploy.sh
