# Changes here will be overwritten by Copier; NEVER EDIT MANUALLY
_commit: v2.1.1
_src_path: gh:brizenchi/keel
backend: true
ci_caller_job: keel
ci_mode: reusable
codeowners: '@brizenchi'
commit_scopes:
- tracing
- ginx
- slog
- httpx
- pgx
- rdx
- auth
- billing
- email
- referral
- quickstart
- nextjs
- deploy
- docs
- ci
components:
- docs
- ci
- commit-lint
- secrets
- hooks
- github
- pr-template
- codeowners
- dependabot
- security-policy
- editorconfig
- gitignore
- ai
default_branch: main
github_repo: brizenchi/go-modules
go_modules:
-   dir: .
    lint_version: v1.64.5
    packages: ./foundation/... ./modules/...
-   dir: templates/quickstart
    lint: false
languages:
- go
- node
node_projects:
-   dir: templates/quickstart-nextjs
    package_manager: npm
    scripts: verify
project_name: go-modules
